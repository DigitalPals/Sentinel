[package]
name = "cybex-sentinel"
version = "0.1.0"
edition = "2021"
description = "Cybex Sentinel — UniFi & Proxmox monitoring backend"

[[bin]]
name = "cybex-sentinel"
path = "src/main.rs"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
# Authentication: Argon2id password hashing, CSPRNG session tokens, token
# hashing. All pure-Rust, matching the project's rustls/no-C-deps stance.
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
# `time` is already in the tree via the cookie crate; used here only to set
# the session cookie's Max-Age.
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# `toml` is retained ONLY for the one-time `import-config` subcommand
# (src/importer.rs), which reads the legacy config.toml into the database.
# Runtime configuration is loaded from PostgreSQL, never from a file.
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
] }

[profile.release]
opt-level = 2
