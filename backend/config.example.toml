# Cybex Sentinel — backend configuration (example)
# Copy to config.toml and fill in your own infrastructure credentials.

poll_interval_sec = 15
bind = "0.0.0.0:8787"

# UniFi Network — local Integration API (UniFi Network 9.0+).
# Create the API key in the UniFi Network app: Settings → Control Plane → Integrations.
[unifi]
host = "https://192.168.1.1"
api_key = "YOUR_UNIFI_API_KEY"

# One [[proxmox]] block per Proxmox VE host or cluster.
# Create the token under Datacenter → Permissions → API Tokens with at least
# PVEAuditor on '/'.
[[proxmox]]
name = "Proxmox"
host = "https://192.168.1.10:8006"
token_id = "monitoring@pve!monitoring-tool"
token_secret = "00000000-0000-0000-0000-000000000000"
